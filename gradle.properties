# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings (https://parchmentmc.org/docs/getting-started)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft & NeoForge versions
# Verify current versions at: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.230
loader_version_range=[1,)

# Mod properties
mod_id=recipebookreforged
mod_name=Recipe Book Reforged
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.zackm.recipebookreforged
mod_authors=zackm
mod_description=A progressive recipe book for heavily modded 1.21.1 NeoForge packs. Unlocks recipes as you collect materials, covers all recipe types including modded.
